services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: asteron_docker
    volumes:
      # Named volume so data survives `docker compose down` / restarts.
      - db_data:/var/lib/mysql
      # Only runs on a FRESH volume (MySQL's entrypoint skips it once
      # /var/lib/mysql already has data) — same schema dump used locally.
      - ./Data Base/asteron_v2.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pasteron_docker"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Overrides backend/.env — inside the Compose network the DB isn't
      # reachable at "localhost", it's the "mysql" service name, and the
      # root password must match the mysql service above.
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: asteron_docker
      DB_NAME: asteron
      FRONTEND_URL: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  db_data:
