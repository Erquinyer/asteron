server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # react-router-dom uses client-side routing — any path that isn't a real
  # static file (e.g. /proyectos/12) must fall back to index.html so React
  # Router can take over, instead of nginx returning a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
