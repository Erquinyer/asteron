server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Archivos de Vite con hash en el nombre (/assets/index-a1b2c3.js): si cambian,
  # cambia el nombre, así que el navegador puede guardarlos un año.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html sin caché: tras un despliegue, el navegador pide los archivos nuevos
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # react-router-dom uses client-side routing — any path that isn't a real
  # static file (e.g. /proyectos/12) must fall back to index.html so React
  # Router can take over, instead of nginx returning a 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
